worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    upstream auth_service {
        server authservice:8080;
    }

    upstream articles_service {
        server articlesservice:8081;
    }

    upstream tasks_service {
        server tasksservice:8082;
    }

    upstream user_service {
        server userservice:8083;
    }

    upstream file_service {
        server fileservice:8084;
    }

    server {
        listen 80;
        server_name 28web.xyz www.28web.xyz;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        ssl_certificate /etc/letsencrypt/live/28web.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/28web.xyz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 500m;

        server_name 28web.xyz www.28web.xyz;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri.html $uri/ =404;
        }

        location = /api/auth {
            return 308 /api/auth/$is_args$args;
        }

        location /api/auth/ {
            proxy_pass http://auth_service/;
        }

        location = /api/articles {
            return 308 /api/articles/$is_args$args;
        }

        location /api/articles/ {
            proxy_pass http://articles_service/;
        }

        location = /api/tasks {
            return 308 /api/tasks/$is_args$args;
        }

        location /api/tasks/ {
            proxy_pass http://tasks_service/;
        }

        location = /api/user {
            return 308 /api/user/$is_args$args;
        }

        location /api/user/ {
            proxy_pass http://user_service/;
        }

        location = /api/files {
            return 308 /api/files/$is_args$args;
        }

        location /api/files/ {
            proxy_pass http://file_service/;
        }

        location /api/health {
            access_log off;
            add_header 'Content-Type' 'application/json';
            return 200 '{"status":"UP"}';
        }
    }
}
